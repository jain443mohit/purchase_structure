<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Explorer</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #1a2233;
    --border: #2a3550;
    --text: #e8edf7;
    --muted: #8b96ad;
    --accent: #5eead4;
    --chip: #24304a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 20px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); margin-bottom: 28px; font-size: 0.95rem; }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }
  .filters input, .filters select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.95rem;
    outline: none;
  }
  .filters input:focus, .filters select:focus { border-color: var(--accent); }
  .filters input { flex: 1; min-width: 200px; }

  .count { color: var(--muted); font-size: 0.85rem; margin-bottom: 12px; }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  th, td { padding: 12px 16px; text-align: left; }
  th {
    background: var(--chip);
    color: var(--muted);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  tr + tr td { border-top: 1px solid var(--border); }
  tbody tr:hover { background: #202b44; }

  .badge {
    display: inline-block;
    background: var(--chip);
    color: var(--accent);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.78rem;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px !important;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Product Explorer</h1>
  <p class="subtitle">Search by name or filter by category and price range.</p>

  <div class="filters">
    <input type="text" id="searchBox" placeholder="Search products..." />
    <select id="categoryFilter">
      <option value="all">All categories</option>
    </select>
    <select id="priceFilter">
      <option value="all">Any price</option>
      <option value="0-50">Under $50</option>
      <option value="50-200">$50 – $200</option>
      <option value="200-99999">Over $200</option>
    </select>
  </div>

  <p class="count" id="resultCount"></p>

  <table>
    <thead>
      <tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
// ---- Your data lives here (or load it from a data.json file) ----
const data = [
  { name: "Wireless Mouse",    category: "Electronics", price: 25,  stock: 140 },
  { name: "Mechanical Keyboard", category: "Electronics", price: 89,  stock: 60 },
  { name: "Office Chair",      category: "Furniture",   price: 220, stock: 15 },
  { name: "Standing Desk",     category: "Furniture",   price: 450, stock: 8 },
  { name: "Notebook Pack",     category: "Stationery",  price: 12,  stock: 300 },
  { name: "Fountain Pen",      category: "Stationery",  price: 55,  stock: 45 },
  { name: "USB-C Hub",         category: "Electronics", price: 40,  stock: 90 },
  { name: "Desk Lamp",         category: "Furniture",   price: 35,  stock: 70 },
  { name: "Monitor 27\"",      category: "Electronics", price: 310, stock: 22 },
  { name: "Sticky Notes",      category: "Stationery",  price: 6,   stock: 500 },
];

const searchBox      = document.getElementById("searchBox");
const categoryFilter = document.getElementById("categoryFilter");
const priceFilter    = document.getElementById("priceFilter");
const tableBody      = document.getElementById("tableBody");
const resultCount    = document.getElementById("resultCount");

// Build category dropdown dynamically from the data
[...new Set(data.map(d => d.category))].forEach(cat => {
  const opt = document.createElement("option");
  opt.value = cat;
  opt.textContent = cat;
  categoryFilter.appendChild(opt);
});

function applyFilters() {
  const search = searchBox.value.trim().toLowerCase();
  const cat    = categoryFilter.value;
  const price  = priceFilter.value;

  const filtered = data.filter(item => {
    const matchesSearch = item.name.toLowerCase().includes(search);
    const matchesCat    = cat === "all" || item.category === cat;
    let matchesPrice = true;
    if (price !== "all") {
      const [min, max] = price.split("-").map(Number);
      matchesPrice = item.price >= min && item.price <= max;
    }
    return matchesSearch && matchesCat && matchesPrice;
  });

  render(filtered);
}

function render(rows) {
  resultCount.textContent = `${rows.length} of ${data.length} products`;
  if (rows.length === 0) {
    tableBody.innerHTML = `<tr><td colspan="4" class="empty">No products match your filters. Try clearing the search.</td></tr>`;
    return;
  }
  tableBody.innerHTML = rows.map(item => `
    <tr>
      <td>${item.name}</td>
      <td><span class="badge">${item.category}</span></td>
      <td>$${item.price}</td>
      <td>${item.stock}</td>
    </tr>
  `).join("");
}

// Re-filter on every input change
searchBox.addEventListener("input", applyFilters);
categoryFilter.addEventListener("change", applyFilters);
priceFilter.addEventListener("change", applyFilters);

applyFilters(); // initial render
</script>
</body>
</html>
